services:
  - type: web
    name: meta-whatsapp-engine
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_ENGINE_SECRET
        value: fastro_whatsapp_secret_key_2026
      - key: ERP_URL
        value: https://metainfinity.online
